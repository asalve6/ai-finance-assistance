[project]
name = "penny"
version = "0.1.0"
description = "Multi-agent money coach for kids"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.7",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "streamlit>=1.40",
    "pyyaml>=6.0.3",
    "numpy>=2.5.3",
    "faiss-cpu>=1.15.1",
    "openai>=3.26.0",
    "python-dotenv>=1.2.4",
    "langgraph>=1.2.14",
    "yfinance>=1.7.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/penny"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Table-style tests read better with one case per line, even when the line is long.
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["penny"]
branch = true

[tool.coverage.report]
fail_under = 90  # the gate: `make cov` fails below this
show_missing = true
skip_covered = true
