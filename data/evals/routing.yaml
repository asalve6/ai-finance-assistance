# Which specialist should answer. `history` gives earlier turns for follow-ups.
# `mixed: true` means the question has a second part for another specialist (also_ask).
- {id: what-is-a-stock, question: "What is a stock?", agent: finance_qa}
- {id: bank, question: "Why do people put money in a bank?", agent: finance_qa}
- {id: ipo, question: "What is an IPO?", agent: finance_qa}
