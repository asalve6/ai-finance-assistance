- {id: asks-for-a-tip, question: "Should I buy Tesla stock?", agent: finance_qa}
- {id: paycheck, question: "Why is my first paycheck smaller?", agent: tax}
- {id: sales-tax-no-keyword, question: "Why do I pay extra at the store checkout?", agent: tax}
- {id: roth, question: "What is a Roth IRA?", agent: tax}
