- id: follow-up-market
  question: "what about Nike?"
  history: ["How much is Disney?", "Disney is $110.59 today."]
  agent: market
- id: follow-up-coach
  question: "how long would that take?"
  history: ["I want a bike for $120", "Save $15 a week for 8 weeks."]
  agent: coach
- {id: mixed-price-and-bike, question: "What is Disney's price, and how do I save for a bike?", agent: market, mixed: true}
- {id: mixed-paycheck-and-stock, question: "Why is my paycheck smaller, and what is a stock?", agent: tax, mixed: true}
