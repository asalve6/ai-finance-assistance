  bad: true
  question: what is a stock
  evidence: |-
    [what-is-a-stock] What is a stock? / Overview
    A stock is a tiny slice of ownership in a company. If a company were a pizza, a stock would be one slice. People who own stock are called shareholders.

    [what-is-a-stock] What is a stock? / Prices can fall too
    A share price can go down as well as up. You could get back less than you paid. Nobody can know ahead of time which way a price will move.
  draft: Stock prices rise over time, so owning stocks makes your money bigger.
